<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FMS Chat Bubble</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { margin:0; padding:0; font-family: Arial, Helvetica, sans-serif; background:#eef2f6; }

    .chat-wrapper {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 380px;
      max-height: 80vh;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #1f3c88;
      color: #fff;
      padding: 12px;
      display:flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }

    .chat-header button {
      background:#fff;
      color:#1f3c88;
      border:none;
      padding:4px 10px;
      border-radius:4px;
      cursor:pointer;
      font-weight:bold;
    }

    .chat-body {
      padding: 12px;
      flex: 1;
      overflow-y: auto;
      background: #f7f9fc;
      font-size: 13px;
      color:#333;
    }

    .summary-card {
      background: #fff;
      border: 1px solid #dce1eb;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }

    .loading {
      display: flex;
      align-items: center;
      gap: 8px;
      font-style: italic;
      color: #555;
      margin-bottom: 10px;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #c9d3ea;
      border-top: 2px solid #1f3c88;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .bubble-bar {
      display:flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
    }

    .bubble {
      padding: 6px 10px;
      border-radius: 14px;
      background: #e6ebf5;
      color: #1f3c88;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid #c9d3ea;
      user-select:none;
    }

    .bubble.active {
      background: #1f3c88;
      color: #fff;
      border-color: #1f3c88;
    }

    .divider {
      height: 1px;
      background: #dce1eb;
      margin: 8px 0;
    }

    .question {
      display:block;
      padding: 6px 10px;
      margin: 6px 0;
      border-left: 3px solid #1f3c88;
      background: #ffffff;
      border-radius: 6px;
      cursor: pointer;
      color:#1f3c88;
      font-weight: bold;
    }

    .answer {
      background:#ffffff;
      border:1px solid #dce1eb;
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
    }

    .chat-input {
      display:flex;
      border-top: 1px solid #ccc;
    }

    .chat-input input {
      flex:1;
      border:none;
      padding: 10px;
      font-size: 14px;
      outline:none;
    }

    .chat-input button {
      border:none;
      padding: 10px 14px;
      background:#1f3c88;
      color:#fff;
      cursor:pointer;
      font-weight:bold;
    }

    a { color:#1f3c88; font-weight:bold; text-decoration: underline; }
  </style>
</head>

<body>
  <div class="chat-wrapper">
    <div class="chat-header">
      <span>FMS Chat</span>
      <button onclick="resetChat()">Clear</button>
    </div>

    <div id="chatBody" class="chat-body"></div>

    <div class="chat-input">
      <input id="userInput" type="text" placeholder="Enter trip / order / LH number…" />
      <button onclick="startSearch()">Send</button>
    </div>
  </div>

<script>
  const chatBody = document.getElementById("chatBody");
  const userInput = document.getElementById("userInput");

  let summaryEmitted = false;
  let selectedScope = null;
  let loadingRow = null;
  let contextType = null;

  /* =========
     CONTEXT SCOPES
  ========= */

  const CONTEXT_SCOPES = {
    TRIP: [
      { key: "files", label: "Trip files" },
      { key: "orders", label: "Trip orders" },
      { key: "history", label: "Trip history" }
    ],
    ORDER: [
      { key: "order", label: "Order details" },
      { key: "files", label: "Order files" },
      { key: "history", label: "Order history" }
    ],
    LINEHAUL: [
      { key: "orders", label: "Linehaul orders" }
    ]
  };

  const QUESTIONS = {
    files: [
      { action: "count", label: "How many files?" },
      { action: "list", label: "List attached files" }
    ],
    orders: [
      { action: "count", label: "How many orders?" },
      { action: "list", label: "List orders" }
    ],
    history: [
      { action: "latest", label: "What is the latest event?" },
      { action: "count", label: "How many events?" }
    ],
    order: [
      { action: "status", label: "What is the order status?" },
      { action: "basic", label: "Show order basics" },
      { action: "shipper", label: "Show shipper" },
      { action: "consignee", label: "Show consignee" },
      { action: "billing", label: "Show billing" },
      { action: "freight", label: "Show freight" },
      { action: "pallets", label: "Show pallets" }
    ]
  };

  /* =========
     UI HELPERS
  ========= */

  function clearBody() {
    chatBody.innerHTML = "";
  }

  function showLoading(text) {
    loadingRow = document.createElement("div");
    loadingRow.className = "loading";
    loadingRow.innerHTML = `<div class="spinner"></div><div>${text}</div>`;
    chatBody.appendChild(loadingRow);
  }

  function hideLoading() {
    if (loadingRow) loadingRow.remove();
    loadingRow = null;
  }

  function renderSummaryCard(html) {
    const card = document.createElement("div");
    card.className = "summary-card";
    card.innerHTML = html;
    chatBody.appendChild(card);
  }

  function rebuildInteractionArea() {
    document.querySelectorAll(".bubble-bar, .divider, .question").forEach(el => el.remove());

    if (!contextType) return;

    const bar = document.createElement("div");
    bar.className = "bubble-bar";

    CONTEXT_SCOPES[contextType].forEach(s => {
      const b = document.createElement("div");
      b.className = "bubble" + (s.key === selectedScope ? " active" : "");
      b.textContent = s.label;
      b.onclick = () => { selectedScope = s.key; rebuildInteractionArea(); };
      bar.appendChild(b);
    });

    chatBody.appendChild(bar);
    chatBody.appendChild(document.createElement("div")).className = "divider";

    (QUESTIONS[selectedScope] || []).forEach(q => {
      const el = document.createElement("div");
      el.className = "question";
      el.textContent = `> ${q.label}`;
      el.onclick = () => askQuestion(selectedScope, q.action);
      chatBody.appendChild(el);
    });
  }

  /* =========
     SEARCH
  ========= */

  async function startSearch() {
    const keyword = userInput.value.trim();
    if (!keyword) return;

    clearBody();
    summaryEmitted = false;
    contextType = null;
    selectedScope = null;

    showLoading("Loading data…");
    userInput.value = "";

    const res = await fetch("/api/search", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ keyword })
    });

    const data = await res.json();
    hideLoading();

    if (!data?.summary) {
      chatBody.innerHTML = `<div class="answer">No results found.</div>`;
      return;
    }

    summaryEmitted = true;
    contextType = data.contextType || "TRIP";
    selectedScope = CONTEXT_SCOPES[contextType][0].key;

    /* ----- SUMMARY RENDERING ----- */

    if (contextType === "TRIP") {
      const s = data.summary;
      renderSummaryCard(`
        <div style="font-weight:bold;">Trip Summary — ${s.tripNo}</div>
        <div>Status: ${s.status}</div>
        <div>Dispatch: ${s.dispatchDate}</div>
        <div>Route: ${s.route}</div>
        <div>Deliveries: ${s.deliveries} | Pickups: ${s.pickups} | Linehauls: ${s.linehauls}</div>
      `);
    }

    if (contextType === "ORDER") {
      const s = data.summary;
      renderSummaryCard(`
        <div style="font-weight:bold;">Order Summary — ${s.orderNo}</div>
        <div>PRO: ${s.proNo}</div>
        <div>Status: ${s.status} (${s.subStatus})</div>
        <div>Terminals: ${s.terminals}</div>
        <div>Current Location: ${s.currentLocation}</div>
        <div>Pallets: ${s.pallets}</div>
      `);
    }

    if (contextType === "LINEHAUL") {
      const s = data.summary;
      renderSummaryCard(`
        <div style="font-weight:bold;">Linehaul — ${s.linehaulNo}</div>
        <div><strong>Trip:</strong> ${s.tripNo || "—"}</div>
        <div><strong>Route:</strong> ${s.org_terminal || "—"} → ${s.dst_terminal || "—"}</div>
        <div><strong>Status:</strong> ${s.status || "Unknown"}</div>
        <div style="margin-top:6px;"><strong>Orders:</strong> ${s.orders}</div>
        ${s.error ? `<div style="color:#b00020;margin-top:6px;">${s.error}</div>` : ""}
      `);
    }


    rebuildInteractionArea();
  }

  /* =========
     QUESTIONS
  ========= */

  async function askQuestion(scope, action) {
    if (!summaryEmitted) return;

    const res = await fetch("/api/message", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ scope, action })
    });

    const data = await res.json();
    const box = document.createElement("div");
    box.className = "answer";
    box.innerHTML = data.reply || "No response.";
    chatBody.appendChild(box);
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  async function resetChat() {
    await fetch("/api/reset", { method: "POST" });
    clearBody();
    summaryEmitted = false;
    contextType = null;
    selectedScope = null;
  }
</script>
</body>
</html>
